name: Build InkFlow APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar InkFlow APK
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🛠️ Compilar aplicación web
        run: npm run build

      - name: 🔄 Sincronizar Capacitor
        run: npx cap sync android

      - name: 🔍 Verificar proyecto Android
        run: |
          echo "===== Android ====="
          test -d android
          test -f android/gradlew
          echo "Proyecto Android encontrado"

          echo
          echo "===== SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "===== Plataformas ====="
          ls -la "$ANDROID_HOME/platforms" || true

          echo
          echo "===== Build Tools ====="
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: 🔑 Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: 📱 Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 🔎 Buscar APK generado
        run: |
          echo "===== APK GENERADO ====="
          find android/app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;

      - name: 📦 Preparar APK
        run: |
          mkdir -p apk-output

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK"
            echo
            echo "Archivos disponibles:"
            find android/app/build/outputs -type f -print
            exit 1
          fi

          cp "$APK" apk-output/InkFlow-debug.apk

          echo
          echo "===== APK LISTO ====="
          ls -lh apk-output/

      - name: 📤 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: InkFlow-APK
          path: apk-output/InkFlow-debug.apk
          if-no-files-found: error
          retention-days: 30
